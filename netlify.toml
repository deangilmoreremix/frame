[build]
  command = "pnpm install && pnpm --filter @frame/common run build && pnpm --filter @frame/web run build"
  publish = "packages/frame-web/.next"

[build.environment]
  NODE_VERSION = "18"
  NEXT_PUBLIC_API_URL = "/api"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["packages/frame-backend/dist/**", "packages/frame-common/dist/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
